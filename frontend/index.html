<!DOCTYPE html>

<!-- #3BBA9C - quoted text, icons -->
<!-- #2E3047 - background -->
<!-- #43455C - submenu -->
<!-- #3c3f58 - main menu -->
<!-- #707793 - dark text, borders etc -->
<html>
  <head>
    <meta charset="UTF-8">
    <title>RPGLM</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/lorebook.css">
  </head>
  <body class="main-body">
    <header class="main-header">
      <button class="menu-button">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-bars"></use>
        </svg>
      </button>
      <button class="menu-button" id="lorebook-open-btn">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-book"></use>
        </svg>
      </button>
      <svg class="logo">
        <use href="/assets/icons/icons.svg#icon-battery-car"></use>
      </svg>
      <button class="menu-button">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-portrait"></use>
        </svg>
      </button>
      <button class="menu-button">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-address-card"></use>
        </svg>
      </button>
    </header>
    <div class="chat-window"></div>
    <footer class="main-footer">
      <button class="menu-button">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-bars"></use>
        </svg>
      </button>
      <textarea class="message-input" style="resize: vertical;" placeholder="Enter message"></textarea>
      <button class="menu-button">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-arrow-right"></use>
        </svg>
      </button>
      <button class="menu-button">
        <svg class="icon" width="45" height="45">
          <use href="/assets/icons/icons.svg#icon-paper-plane"></use>
        </svg>
      </button>
    </footer>
    <script src="/js/chat.js"></script>
    <script src="/js/lorebook.js"></script>
    <script>
      document.getElementById('lorebook-open-btn').addEventListener('click', () => {
        if (window.lorebookUI) window.lorebookUI.open();
      });
    </script>
  </body>
</html>
